<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Бюджет">
<meta name="robots" content="noindex, nofollow">
<title>Сімейний бюджет</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#F4F6F8; --card:#FFFFFF; --text:#0F172A; --muted:#64748B; --line:#EEF1F5; --border:rgba(15,23,42,.06);
  --accent:#4F46E5; --accent2:#7C3AED; --accent-soft:#E0E7FF; --inc:#00A84A; --exp:#FF5252; --warn:#F59E0B; --bad:#E53935;
  --chip:#F1F4F8; --shadow:0 4px 20px rgba(15,23,42,.05); --glow:rgba(79,70,229,.40);
  --r:20px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0F172A; --card:#1E293B; --text:#F8FAFC; --muted:#94A3B8; --line:rgba(255,255,255,.06); --border:rgba(255,255,255,.08);
    --accent:#6366F1; --accent2:#8B5CF6; --accent-soft:rgba(99,102,241,.22); --inc:#10B981; --exp:#F43F5E; --warn:#F59E0B; --bad:#F43F5E;
    --chip:#273449; --shadow:0 4px 20px rgba(0,0,0,.25); --glow:rgba(99,102,241,.45);}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.app{max-width:560px;margin:0 auto;padding:calc(var(--safe-t) + 8px) 14px calc(var(--safe-b) + 90px)}
header.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 2px 10px}
header.top h1{font-size:20px;margin:0;font-weight:700;letter-spacing:-.01em}
.sync{display:flex;align-items:center;gap:6px;border:0;background:var(--chip);border-radius:20px;padding:6px 10px;font-size:12px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:#9ca3af}
.dot.ok{background:var(--inc)} .dot.pending{background:var(--warn)} .dot.err{background:var(--bad)} .dot.busy{background:var(--accent);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.monthnav{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:var(--r);padding:4px;margin-bottom:12px;box-shadow:var(--shadow);border:1px solid var(--border)}
.monthnav button{border:0;background:none;width:44px;height:40px;font-size:22px;color:var(--accent);border-radius:12px}
.monthnav b{font-size:16px}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--shadow);border:1px solid var(--border)}
.card h3{margin:0 0 10px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.card h3 a,.link{color:var(--accent);font-weight:500;font-size:14px;text-decoration:none;background:none;border:0;padding:0}
.hero{position:relative;overflow:hidden;border-radius:22px;padding:18px 18px 16px;margin-bottom:12px;color:#fff;
  background:linear-gradient(135deg,#4F46E5 0%,#7C3AED 100%);box-shadow:0 12px 30px rgba(79,70,229,.35)}
.hero:after{content:"";position:absolute;right:-40px;top:-60px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.10)}
.hero small{display:block;opacity:.8;font-size:12px}
.hero .big{font-size:32px;font-weight:800;letter-spacing:-.02em;margin:2px 0 14px;white-space:nowrap}
.hero .hrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;background:rgba(255,255,255,.12);border-radius:14px;padding:10px 12px}
.hero .hrow b{font-size:15px;white-space:nowrap}
.fx{cursor:pointer}
.fxg{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:8px}
.fxg div{background:var(--chip);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:1px}
.fxg small{color:var(--muted);font-size:11px}
.fxg b{font-size:16px;white-space:nowrap}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal i{font-style:normal;text-align:center;font-size:11px;color:var(--muted);padding-bottom:2px}
.cd{border:0;background:var(--chip);border-radius:10px;min-height:48px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:2px;color:var(--text)}
.cd span{font-size:12px;color:var(--muted)}
.cd b{font-size:11px;color:var(--inc);font-weight:700}
.cd.has{background:rgba(16,185,129,.16)}
.cd.today{outline:2px solid var(--accent)}
.drag{cursor:grab;touch-action:none;font-size:20px;color:var(--muted);padding:6px 4px;user-select:none}
.row.dragging{opacity:.6;background:var(--accent-soft);border-radius:12px}
.reorder-btn{display:block;margin:6px auto 0;background:none;border:0;color:var(--muted);font-size:13px}
.heros{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;margin:0 -14px;padding:0 14px 6px;scrollbar-width:none;scroll-padding:0 14px}
.heros::-webkit-scrollbar{display:none}
.heros .hero{flex:0 0 100%;scroll-snap-align:center;margin-bottom:6px}
.hero-cr{background:linear-gradient(135deg,#E11D48 0%,#9333EA 100%);box-shadow:0 12px 30px rgba(225,29,72,.30)}
.hdots{display:flex;justify-content:center;gap:6px;margin:0 0 12px}
.hdots button{border:0;background:var(--chip);color:var(--muted);border-radius:20px;padding:6px 14px;font-size:13px;font-weight:600}
.hdots button.on{background:var(--accent);color:#fff}
.heros{cursor:grab}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.stat{background:var(--card);border-radius:16px;padding:11px;box-shadow:var(--shadow);border:1px solid var(--border)}
.stat small{display:block;color:var(--muted);font-size:12px}
.stat b{font-size:16px;white-space:nowrap}
.inc{color:var(--inc)} .exp{color:var(--exp)} .muted{color:var(--muted)} .bad{color:var(--bad)}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .ic{width:38px;height:38px;border-radius:12px;background:var(--chip);display:grid;place-items:center;font-size:18px;flex:none}
.row .mid{flex:1;min-width:0}
.row .mid div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .mid small{color:var(--muted);font-size:12px}
.row .amt{font-weight:600;white-space:nowrap;text-align:right}
.row.tap{cursor:pointer}
.day{font-size:12px;color:var(--muted);margin:14px 4px 4px;display:flex;justify-content:space-between}
.bar{height:8px;background:var(--chip);border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.bar i.warn{background:var(--warn)} .bar i.over{background:var(--bad)}
.fab{position:fixed;right:max(18px,calc(50% - 262px));bottom:calc(var(--safe-b) + 78px);width:58px;height:58px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:30px;box-shadow:0 8px 25px var(--glow);z-index:20}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:var(--safe-b);z-index:20}
nav.tabs div{display:flex;max-width:560px;width:100%}
nav.tabs button{flex:1;border:0;background:none;padding:8px 0 9px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button span{font-size:20px;line-height:1}
nav.tabs button.on{color:var(--accent);font-weight:600}
.btn{border:0;border-radius:12px;padding:12px 16px;background:var(--accent);color:#fff;font-weight:600;box-shadow:0 4px 14px var(--glow)}
.btn.sec,.btn.danger{box-shadow:none}
.btn.sec{background:var(--chip);color:var(--text)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn.block{width:100%}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btns{display:flex;gap:8px;margin-top:14px}
.btns .btn{flex:1}
.empty{text-align:center;color:var(--muted);padding:18px 8px}
.menu .row{cursor:pointer}
.menu .row .amt{color:var(--muted);font-weight:400}
/* sheet */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center;z-index:50}
.sheet.open{display:flex}
.sheet .panel{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:14px 16px calc(var(--safe-b) + 16px);animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
.sheet .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sheet .head b{font-size:17px}
.x{border:0;background:var(--chip);width:32px;height:32px;border-radius:50%;font-size:18px}
label.f{display:block;margin:12px 0 4px;font-size:13px;color:var(--muted)}
input.in,select.in,textarea.in{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 12px;font-size:16px;outline:none}
input.in:focus,select.in:focus{border-color:var(--accent)}
input.big{font-size:30px;font-weight:700;text-align:center;padding:10px}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:3px}
.seg label{flex:1;text-align:center}
.seg input{display:none}
.seg span{display:block;padding:8px 0;border-radius:10px;font-weight:600;font-size:14px;color:var(--muted)}
.seg input:checked+span{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips label input{display:none}
.chips label span{display:inline-block;padding:7px 11px;border-radius:20px;background:var(--card);border:1px solid var(--line);font-size:14px}
.chips label input:checked+span{background:var(--accent-soft);border-color:var(--accent);color:var(--text);font-weight:600}
.check{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:14px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.filters{display:flex;gap:6px;overflow-x:auto;margin-bottom:8px;padding-bottom:2px}
.filters select,.filters input{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 8px;font-size:14px;min-width:0}
.filters input{flex:1;min-width:110px}
.toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 150px);transform:translateX(-50%);background:#1c1f1d;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:90;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:.95}
.legend .row{padding:7px 0}
.sw{width:12px;height:12px;border-radius:4px;flex:none}
.pill{display:inline-block;font-size:11px;padding:2px 7px;border-radius:10px;background:var(--chip);color:var(--muted);margin-left:4px}
.pill.bad{background:rgba(220,38,38,.12);color:var(--bad)}
.pill.ok{background:rgba(21,128,61,.12);color:var(--inc)}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}
.hint code{background:var(--chip);padding:1px 5px;border-radius:5px;font-size:12px}
/* lock */
.lock{position:fixed;inset:0;background:var(--bg);z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center;gap:22px}
.lock.open{display:flex}
.pins{display:flex;gap:14px}
.pins i{width:14px;height:14px;border-radius:50%;border:2px solid var(--accent)}
.pins i.f{background:var(--accent)}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px}
.pad button{height:72px;border-radius:50%;border:0;background:var(--card);font-size:26px;box-shadow:var(--shadow)}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
svg text{fill:var(--text)}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1 id="title" data-act="syncNow" style="cursor:pointer">Сімейний бюджет</h1>
    <button class="sync" id="syncBtn" data-act="syncNow"><i class="dot" id="syncDot"></i><span id="syncTxt">локально</span></button>
  </header>
  <main id="main"></main>
</div>
<button class="fab" data-act="addTx" aria-label="Додати операцію">+</button>
<nav class="tabs"><div id="tabs"></div></nav>
<div class="sheet" id="sheet"><div class="panel" id="panel"></div></div>
<div class="lock" id="lock">
  <div style="font-size:40px">🔒</div>
  <div class="muted">Введіть PIN-код</div>
  <div class="pins" id="pins"></div>
  <div class="pad" id="pad"></div>
</div>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* ============ helpers ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad2 = n => String(n).padStart(2, '0');
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; };
const curMonth = () => todayStr().slice(0, 7);
const addMonth = (m, k) => { let [y, mo] = m.split('-').map(Number); mo += k; while (mo > 12) { mo -= 12; y++; } while (mo < 1) { mo += 12; y--; } return `${y}-${pad2(mo)}`; };
const daysInMonth = m => { const [y, mo] = m.split('-').map(Number); return new Date(y, mo, 0).getDate(); };
const monthName = (m, short) => {
  const [y, mo] = m.split('-').map(Number);
  let s = new Date(y, mo - 1, 1).toLocaleDateString('uk-UA', short ? { month: 'short' } : { month: 'long', year: 'numeric' });
  s = s.replace(/\s?р\.?$/, '').replace('.', '');
  return s.charAt(0).toUpperCase() + s.slice(1);
};
const dayLabel = d => {
  const t = todayStr(); const y = new Date(); y.setDate(y.getDate() - 1);
  const ys = `${y.getFullYear()}-${pad2(y.getMonth()+1)}-${pad2(y.getDate())}`;
  if (d === t) return 'Сьогодні'; if (d === ys) return 'Вчора';
  const [Y, M, D] = d.split('-').map(Number);
  return new Date(Y, M - 1, D).toLocaleDateString('uk-UA', { day: 'numeric', month: 'long', weekday: 'short' });
};
const nf = new Intl.NumberFormat('uk-UA', { maximumFractionDigits: 2 });
const nf0 = new Intl.NumberFormat('uk-UA', { maximumFractionDigits: 0 });
const cur = () => (getSetting('currency') || '₴');
const money = (v, sign) => (sign && v > 0 ? '+' : '') + (v < 0 ? '−' : '') + nf.format(Math.abs(Math.round(v * 100) / 100)) + ' ' + cur();
const money0 = v => (v < 0 ? '−' : '') + nf0.format(Math.abs(v)) + ' ' + cur();
const CURS = { UAH: '₴', USD: '$' };
const CUR_NAMES = { UAH: 'гривня', USD: 'долар' };
const FX = ['USD'];
const accCur = a => (a && a.cur && CURS[a.cur]) ? a.cur : 'UAH';
const akind = a => (a && a.kind) || 'reg';
const DEFAULT_RATES = { USD: 41.5 };
let RATES_AUTO = {}; try { RATES_AUTO = JSON.parse(localStorage.getItem('fb_rates')) || {}; } catch (e) {}
function rates() { const m = getSetting('rates'); if (m && m.manual) return m; return { ...DEFAULT_RATES, ...RATES_AUTO }; }
function rateOf(c) { if (!c || c === 'UAH') return 1; return Number(rates()[c]) || DEFAULT_RATES[c] || 1; }
const toBase = (v, c) => v * rateOf(c);
const tBase = t => toBase(Number(t.amount) || 0, accCur(get('acc', t.acc)));
function moneyC(v, c, sign) {
  if (!c || c === 'UAH') return money(v, sign);
  return (sign && v > 0 ? '+' : '') + (v < 0 ? '−' : '') + nf.format(Math.abs(Math.round(v * 100) / 100)) + ' ' + CURS[c];
}
const ymd = d => `${d.getFullYear()}${pad2(d.getMonth() + 1)}${pad2(d.getDate())}`;
let ratesBusy = false;
async function fetchRates(manual) {
  if (ratesBusy) return; ratesBusy = true;
  const got = { ...RATES_AUTO };
  const nbu = async d => { const r = await fetch(`https://bank.gov.ua/NBUStatService/v1/statdirectory/exchange?valcode=USD&date=${ymd(d)}&json`, { cache: 'no-store' }); const j = await r.json(); return j[0]; };
  const today = new Date(), yest = new Date(); yest.setDate(yest.getDate() - 1);
  const gh = location.hostname.endsWith('github.io') ? [location.hostname.split('.')[0], location.pathname.split('/')[1] || 'budget'] : ['RomanMokeychuk', 'budget'];
  const [a, b, m, od] = await Promise.allSettled([nbu(today), nbu(yest),
    fetch('https://api.monobank.ua/bank/currency', { cache: 'no-store' }).then(r => r.json()),
    fetch(`https://raw.githubusercontent.com/${gh[0]}/${gh[1]}/rates/rates.json?t=${Date.now()}`, { cache: 'no-store' }).then(r => r.json())]);
  let ok = false;
  if (od.status === 'fulfilled' && od.value?.usd?.buy) { got.odesa = { ...od.value.usd, updated: od.value.updated }; ok = true; }
  if (a.status === 'fulfilled' && a.value?.rate) { got.USD = a.value.rate; got.date = a.value.exchangedate; got.src = 'НБУ'; ok = true; }
  if (b.status === 'fulfilled' && b.value?.rate) got.prevUSD = b.value.rate;
  if (m.status === 'fulfilled' && Array.isArray(m.value)) {
    const x = m.value.find(x => x.currencyCodeA === 840 && x.currencyCodeB === 980);
    if (x) { got.monoBuy = x.rateBuy; got.monoSell = x.rateSell; got.monoT = x.date * 1000; if (!ok) { got.USD = (x.rateBuy + x.rateSell) / 2; got.src = 'Monobank'; got.date = new Date().toLocaleDateString('uk-UA'); } ok = true; }
  }
  ratesBusy = false;
  if (ok) { got.t = Date.now(); RATES_AUTO = got; localStorage.setItem('fb_rates', JSON.stringify(got)); render(); if (manual) toast('Курс оновлено ✓'); }
  else if (manual) toast('Не вдалося отримати курс — перевірте інтернет');
}
function odTime(iso) {
  if (!iso) return ''; const d = new Date(iso); const t = d.toLocaleTimeString('uk-UA', { hour: '2-digit', minute: '2-digit' });
  return d.toDateString() === new Date().toDateString() ? 'сьогодні ' + t : d.toLocaleDateString('uk-UA', { day: 'numeric', month: 'short' }) + ' ' + t;
}
function fxCard() {
  const r = RATES_AUTO, man = getSetting('rates')?.manual;
  if (!r.USD) return `<div class="card tap" data-act="ratesRefresh"><h3>💵 Курс долара</h3><p class="hint" style="margin:0">Курс ще не завантажено — натисніть, щоб оновити.</p></div>`;
  const d = r.prevUSD ? r.USD - r.prevUSD : 0;
  const f2 = v => v.toLocaleString('uk-UA', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const arrow = Math.abs(d) < 0.005 ? '<span class="muted" style="font-size:12px">без змін</span>' : `<span class="${d > 0 ? 'exp' : 'inc'}" style="font-size:12px;font-weight:600">${d > 0 ? '▲' : '▼'} ${f2(Math.abs(d))}</span>`;
  return `<div class="card fx" data-act="ratesRefresh"><h3><span>💵 Курс долара</span><span class="muted" style="font-size:12px;font-weight:400">${esc(r.date || '')} ↻</span></h3>
    <div class="fxg"><div><small>НБУ</small><b>${f2(r.USD)} ₴</b>${r.prevUSD ? arrow : ''}</div>
    ${r.monoBuy ? `<div><small>Моно купівля</small><b>${f2(r.monoBuy)}</b></div><div><small>Моно продаж</small><b>${f2(r.monoSell)}</b></div>` : ''}</div>
    ${r.odesa ? `<div class="fxg" style="margin-top:8px"><div><small>Обмінники Одеси</small><b style="font-size:13px;margin-top:3px">${odTime(r.odesa.updated)}</b><small>${r.odesa.count} пунктів</small></div>
      <div><small>Купівля</small><b>${f2(r.odesa.buy)}</b></div><div><small>Продаж</small><b>${f2(r.odesa.sell)}</b></div></div>
      <p class="hint" style="margin-bottom:0">Найвигідніше купити $ за ${f2(r.odesa.best_sell)} ₴ · продати за ${f2(r.odesa.best_buy)} ₴</p>` : ''}
    ${man ? `<p class="hint" style="margin-bottom:0">Для підрахунків використовується ваш курс: ${f2(rateOf('USD'))} ₴</p>` : ''}</div>`;
}
const parseAmt = s => {
  s = String(s ?? '').replace(/\s/g, '').replace(/,/g, '.');
  if (!s || !/^[\d.+\-]+$/.test(s)) return NaN;

function earnStats(m, who) {
  const t = monthTx(m).filter(x => x.type === 'inc' && x.who === who);
  const byDay = {};
  for (const x of t) { const d = byDay[x.date] = byDay[x.date] || { tips: 0, wage: 0, other: 0 }; const v = tBase(x);
    if (x.cat === 'ci_tips') d.tips += v; else if (x.cat === 'ci_salary') d.wage += v; else d.other += v; }
  const days = Object.entries(byDay).map(([date, d]) => ({ date, ...d, total: d.tips + d.wage + d.other }));
  const shifts = days.filter(d => d.tips || d.wage);
  const tips = sum(days, d => d.tips), wage = sum(days, d => d.wage), other = sum(days, d => d.other);
  const best = shifts.slice().sort((a, b) => b.tips - a.tips)[0];

const ALLOC_TYPES = [['avans', 'Аванс'], ['salary', 'Зарплата'], ['bonus', 'Бонус'], ['wife', 'Від дружини'], ['other', 'Інше']];

/* ---------- Budget ---------- */
function vBudget() {
  const m = UI.month, sp = spentByCat(m), ec = cats('exp');
  const rows = ec.map(c => ({ c, l: limitFor(c.id, m), s: sp[c.id] || 0 }));

  const inc = sum(monthTx(m).filter(t => t.type === 'inc'), tBase);
  const isCur = m === curMonth(); const dim = daysInMonth(m); const day = isCur ? new Date().getDate() : dim;
  const daysLeft = isCur ? dim - day + 1 : 0;
  return monthNav() + `
  <div class="card">

      <small>${money0(s)} ${l ? 'з ' + money0(l) : '· ліміт не задано'}</small>

      <div class="amt ${l && s > l ? 'bad' : 'muted'}" style="font-weight:500;font-size:13px">${l ? (s <= l ? 'зал. ' + money0(l - s) : '−' + money0(s - l)) : '＋'}</div></div>`;

}

/* ---------- Analytics ---------- */
const PAL = ['#6366F1', '#10B981', '#F59E0B', '#F43F5E', '#0EA5E9', '#8B5CF6', '#F97316', '#14B8A6', '#EC4899', '#3B82F6', '#84CC16', '#A855F7', '#64748B'];
function donut(parts, total) {
  const R = 60, C = 2 * Math.PI * R; let off = 0;
  const segs = parts.map((p, i) => { const len = total ? p.v / total * C : 0; const s = `<circle r="${R}" cx="80" cy="80" fill="none" stroke="${p.color}" stroke-width="22" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-off}" transform="rotate(-90 80 80)"/>`; off += len; return s; }).join('');
  return `<svg viewBox="0 0 160 160" width="170" height="170" style="display:block;margin:0 auto"><circle r="${R}" cx="80" cy="80" fill="none" stroke="var(--chip)" stroke-width="22"/>${segs}
    <text x="80" y="76" text-anchor="middle" font-size="11" style="fill:var(--muted)">витрати</text><text x="80" y="94" text-anchor="middle" font-size="15" font-weight="700">${esc(money0(total))}</text></svg>`;
}
function bars(months) {
  const W = 340, H = 170, top = 10, bot = 22, n = months.length, bw = W / n;
  const max = Math.max(1, ...months.map(x => Math.max(x.inc, x.exp)));
  const y = v => top + (H - top - bot) * (1 - v / max);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">
    ${[0.5, 1].map(f => `<line x1="0" x2="${W}" y1="${y(max * f)}" y2="${y(max * f)}" stroke="var(--line)"/><text x="2" y="${y(max * f) - 3}" font-size="9" style="fill:var(--muted)">${nf0.format(max * f)}</text>`).join('')}
    ${months.map((x, i) => { const cx = i * bw + bw / 2, w = Math.max(3, bw * .3);
      return `<rect x="${cx - w - 1}" y="${y(x.inc)}" width="${w}" height="${Math.max(0, H - bot - y(x.inc))}" rx="2" fill="var(--inc)"/>
      <rect x="${cx + 1}" y="${y(x.exp)}" width="${w}" height="${Math.max(0, H - bot - y(x.exp))}" rx="2" fill="var(--exp)"/>
      <text x="${cx}" y="${H - 7}" text-anchor="middle" font-size="9" style="fill:${x.m === UI.month ? 'var(--accent)' : 'var(--muted)'}">${esc(monthName(x.m, true))}</text>`; }).join('')}
  </svg>`;
}
function vStats() {
  const m = UI.month, mt = monthTx(m), sp = spentByCat(m);
  const total = sum(Object.values(sp));
  let parts = Object.entries(sp).map(([id, v]) => ({ id, v, c: catOf(id) })).sort((a, b) => b.v - a.v);
  if (parts.length > 9) { const rest = parts.slice(8); parts = parts.slice(0, 8).concat([{ id: '_rest', v: sum(rest, r => r.v), c: { emoji: '…', name: 'Решта' } }]); }
  parts.forEach((p, i) => p.color = PAL[i % PAL.length]);
  const months = []; for (let k = 11; k >= 0; k--) { const mm = addMonth(m, -k); const t = monthTx(mm); months.push({ m: mm, inc: sum(t.filter(x => x.type === 'inc'), tBase), exp: sum(t.filter(x => x.type === 'exp'), tBase) }); }
  const inc = sum(mt.filter(t => t.type === 'inc'), tBase);
  const prev = months[10];
  const dim = m === curMonth() ? new Date().getDate() : daysInMonth(m);
  const byWho = members().map(p => ({ p, v: sum(mt.filter(t => t.type === 'exp' && t.who === p.id), tBase) })).filter(x => x.v > 0);
  const maxWho = Math.max(1, ...byWho.map(x => x.v));
  const active = months.filter(x => x.inc || x.exp);
  const avgExp = active.length ? sum(active, x => x.exp) / active.length : 0;
  return monthNav() + `
  <div class="stats" style="margin-bottom:12px">
    <div class="stat"><small>На день</small><b>${money0(total / dim)}</b></div>
    <div class="stat"><small>Норма заощаджень</small><b class="${inc && inc - total < 0 ? 'bad' : 'inc'}">${inc ? Math.round((inc - total) / inc * 100) + '%' : '—'}</b></div>
    <div class="stat"><small>vs минулий міс.</small><b class="${total > prev.exp ? 'exp' : 'inc'}">${prev.exp ? (total >= prev.exp ? '+' : '−') + Math.round(Math.abs(total - prev.exp) / prev.exp * 100) + '%' : '—'}</b></div>
  </div>
  <div class="card"><h3>Куди пішли гроші</h3>
    ${total ? donut(parts, total) + `<div class="legend" style="margin-top:10px">${parts.map(p => `<div class="row"><i class="sw" style="background:${p.color}"></i><div class="mid"><div>${p.c.emoji} ${esc(p.c.name)}</div></div><div class="amt" style="font-weight:500">${money0(p.v)} <span class="muted" style="font-size:12px">${Math.round(p.v / total * 100)}%</span></div></div>`).join('')}</div>` : '<div class="empty">Немає витрат за місяць</div>'}
  </div>
  <div class="card"><h3>Доходи й витрати за 12 місяців</h3>${bars(months)}
    <p class="hint"><span class="inc">■</span> доходи &nbsp; <span class="exp">■</span> витрати · середня витрата ${money0(avgExp)}/міс</p></div>
  ${byWho.length ? `<div class="card"><h3>Хто скільки витратив</h3>${byWho.map(x => `<div style="margin:8px 0"><div style="display:flex;justify-content:space-between"><span>${esc(x.p.name)}</span><b>${money0(x.v)}</b></div><div class="bar"><i style="width:${x.v / maxWho * 100}%"></i></div></div>`).join('')}</div>` : ''}
  `;
}

/* goals */
const goalSaved = g => sum(g.contrib || [], c => c.amount);
function goalForecast(g) {
  const saved = goalSaved(g), left = (Number(g.target) || 0) - saved;
  if (left <= 0) return { done: true };
  let per = Number(g.monthly) || 0, auto = false;
  if (!per) { const since = Date.now() - 90 * 864e5; per = sum((g.contrib || []).filter(c => new Date(c.d).getTime() >= since), c => c.amount) / 3; auto = true; }
  const res = { left, per, auto };
  if (g.deadline) { const dl = new Date(g.deadline); const mo = Math.max(1, (dl.getFullYear() - new Date().getFullYear()) * 12 + dl.getMonth() - new Date().getMonth()); res.need = left / mo; }
  if (per > 0) { const months = Math.ceil(left / per); const d = new Date(); d.setMonth(d.getMonth() + months); res.date = d; res.months = months; }
  return res;
}
function vGoals() {
  const gs = list('goal').sort((a, b) => (a.u0 || 0) - (b.u0 || 0));
  return back('Фінансові цілі') + `<button class="btn sm" data-act="editGoal">+ Ціль</button></div>
  ${gs.length ? gs.map(g => {
    const s = goalSaved(g), t = Number(g.target) || 0, f = goalForecast(g);
    return `<div class="card"><h3><span>${esc(g.emoji || '🏁')} ${esc(g.name)}</span><button class="link" data-act="editGoal" data-id="${g.id}">Змінити</button></h3>
      <div style="display:flex;justify-content:space-between"><b>${money0(s)}</b><span class="muted">з ${money0(t)}</span></div>
      <div class="bar"><i style="width:${t ? Math.min(100, s / t * 100) : 0}%"></i></div>
      <p class="hint">${f.done ? '🎉 Ціль досягнуто!' : f.date ? `Залишилось ${money0(f.left)}. При ${money0(f.per)}/міс${f.auto ? ' (ваш темп за 3 міс.)' : ''} — досягнете <b>${f.date.toLocaleDateString('uk-UA', { month: 'long', year: 'numeric' })}</b> (через ${f.months} міс.)` : `Залишилось ${money0(f.left)}. Задайте щомісячний внесок або поповніть ціль, щоб побачити дату.`}
      ${f.need && !f.done ? `<br>Щоб встигнути до ${new Date(g.deadline).toLocaleDateString('uk-UA', { month: 'long', year: 'numeric' })}, потрібно ${money0(f.need)}/міс.` : ''}</p>
      <div class="btns"><button class="btn sm" data-act="goalAdd" data-id="${g.id}">＋ Поповнити</button><button class="btn sec sm" data-act="goalHist" data-id="${g.id}">Історія</button></div></div>`;
  }).join('') : '<div class="card empty">Додайте ціль: відпустка, фінансова подушка, машина… Застосунок порахує дату, коли ви її досягнете.</div>'}`;
}
/* debts */
const debtPaid = d => sum(d.payments || [], p => p.amount);
const debtLeft = d => (Number(d.total) || 0) - debtPaid(d);
function vDebts() {

      if (rec.cur !== 'UAH' && !getSetting('rates')?.manual && !RATES_AUTO.t) fetchRates();
    };
  });
}

    <div class="row"><div class="mid">Нагадувати за</div><input class="in" id="remDays" type="number" min="0" max="14" value="${getSetting('remind')?.days ?? 3}" style="width:70px;text-align:center"><span class="muted">дн.</span><button class="btn sec sm" data-act="saveRemind">OK</button></div></div>

    <div class="btns">${localStorage.getItem(LS.pin) ? '<button class="btn sec sm" data-act="pinOff">Прибрати PIN</button>' : ''}<button class="btn sec sm" data-act="pinSet">${localStorage.getItem(LS.pin) ? 'Змінити PIN' : 'Встановити PIN'}</button></div></div>

  <div class="card"><h3>₴ Символ основної валюти</h3><form id="curf" style="display:flex;gap:8px"><input class="in" name="c" value="${esc(cur())}" style="width:90px"><button class="btn sec" type="submit">OK</button></form></div>
  <div class="card"><h3>💾 Резервна копія</h3>
    <div class="btns" style="flex-wrap:wrap"><button class="btn sec sm" data-act="exportJson">Завантажити JSON</button><button class="btn sec sm" data-act="exportCsv">Завантажити CSV (Excel)</button><button class="btn sec sm" data-act="importJson">Імпортувати JSON</button></div>
    <input type="file" id="impFile" accept=".json,application/json" style="display:none">

  <div class="card"><h3>🔄 Оновлення</h3>
    <p class="hint" style="margin-top:0">Дані синхронізуються самі: при відкритті, після кожної зміни і кожні 45 секунд, поки застосунок відкритий. Якщо на телефоні показується стара версія застосунку — натисніть кнопку.</p>
    <div class="btns"><button class="btn sec sm" data-act="syncNow">Синхронізувати зараз</button><button class="btn sec sm" data-act="updateApp">Оновити застосунок</button></div></div>
  <p class="hint" style="text-align:center">Операцій: ${txs().length} · версія ${APP_VERSION}</p>`, p => {

      if (!n.owner || !n.repo || !n.token) return toast('Заповніть логін, репозиторій і токен');

    };

      setSetting('rates', o); closeSheet(); render(); toast('Курси збережено ✓'); };
    p.querySelector('#curf').onsubmit = e => { e.preventDefault(); setSetting('currency', e.target.elements.c.value.trim() || '₴'); closeSheet(); render(); };
    p.querySelector('#impFile').onchange = e => {
      const file = e.target.files[0]; if (!file) return;
      file.text().then(t => { const d = JSON.parse(t); if (!d.col) throw new Error(); DB = mergeDB(DB, d); COLS.forEach(c => DB.col[c] = DB.col[c] || {}); saveLocal(); markDirty(); closeSheet(); render(); toast('Імпортовано ✓'); })
        .catch(() => toast('Не вдалося прочитати файл'));
    };
  });
}
function memForm(id) {

  openSheet(m ? 'Член родини' : 'Додати', `<form id="mf"><label class="f">Імʼя</label><input class="in" name="name" value="${esc(m?.name || '')}" required>
    <div class="btns">${m ? `<button type="button" class="btn danger" data-act="delMem" data-id="${m.id}">Видалити</button>` : ''}<button class="btn" type="submit">Зберегти</button></div></form>`, p => {

function download(name, text, type) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function exportCsv() {
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const rows = [['Дата', 'Тип', 'Сума', 'Категорія', 'Рахунок', 'Рахунок отримувач', 'Хто', 'Коментар', 'Валюта']];
  txs().sort((a, b) => a.date.localeCompare(b.date)).forEach(t => rows.push([t.date, { exp: 'Витрата', inc: 'Дохід', tr: 'Переказ' }[t.type], String(t.amount).replace('.', ','), t.type === 'tr' ? '' : catOf(t.cat).name, accOf(t.acc).name, t.acc2 ? accOf(t.acc2).name : '', memOf(t.who)?.name || '', t.note || '', accCur(get('acc', t.acc))]));
  download(`budget-${todayStr()}.csv`, '﻿' + rows.map(r => r.map(q).join(';')).join('\r\n'), 'text/csv;charset=utf-8');
}

/* ============ PIN lock ============ */
async function hashPin(pin) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('fb-salt-' + pin)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
let pinBuf = '', pinMode = 'check', pinFirst = '';
function showLock(mode) {
  pinMode = mode || 'check'; pinBuf = ''; pinFirst = '';
  $('#lock .muted').textContent = pinMode === 'check' ? 'Введіть PIN-код' : 'Придумайте PIN з 4 цифр';
  $('#lock').classList.add('open'); drawPins();
}
function drawPins() { $('#pins').innerHTML = [0, 1, 2, 3].map(i => `<i class="${i < pinBuf.length ? 'f' : ''}"></i>`).join(''); }
$('#pad').innerHTML = [1, 2, 3, 4, 5, 6, 7, 8, 9, '', 0, '⌫'].map(k => k === '' ? (localStorage.getItem(LS.pin) ? '<span></span>' : '<button data-pin="cancel" style="font-size:14px">Скасувати</button>') : `<button data-pin="${k}">${k}</button>`).join('');
$('#pad').addEventListener('click', async e => {
  const k = e.target.closest('button')?.dataset.pin; if (k == null) return;
  if (k === 'cancel') { $('#lock').classList.remove('open'); return; }
  if (k === '⌫') { pinBuf = pinBuf.slice(0, -1); drawPins(); return; }
  if (pinBuf.length >= 4) return;
  pinBuf += k; drawPins();
  if (pinBuf.length < 4) return;
  const h = await hashPin(pinBuf);
  if (pinMode === 'check') {
    if (h === localStorage.getItem(LS.pin)) { $('#lock').classList.remove('open'); }
    else { $('#pins').classList.add('shake'); setTimeout(() => { $('#pins').classList.remove('shake'); pinBuf = ''; drawPins(); }, 350); }
  } else if (!pinFirst) { pinFirst = h; pinBuf = ''; $('#lock .muted').textContent = 'Повторіть PIN'; setTimeout(drawPins, 150); }
  else if (pinFirst === h) { localStorage.setItem(LS.pin, h); $('#lock').classList.remove('open'); toast('PIN встановлено'); pinMode = 'check'; rebuildPad(); }
  else { pinFirst = ''; pinBuf = ''; $('#lock .muted').textContent = 'Не збіглося. Придумайте PIN заново'; setTimeout(drawPins, 150); }
});
function rebuildPad() { $('#pad').innerHTML = [1, 2, 3, 4, 5, 6, 7, 8, 9, '', 0, '⌫'].map(k => k === '' ? (pinMode === 'set' ? '<button data-pin="cancel" style="font-size:14px">Скасувати</button>' : '<span></span>') : `<button data-pin="${k}">${k}</button>`).join(''); }
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { hiddenAt = Date.now(); if (localStorage.getItem(LS.dirty) && SYNC.token) syncNow(); }
  else {
    if (localStorage.getItem(LS.pin) && Date.now() - hiddenAt > 60000 && hiddenAt) { rebuildPad(); showLock('check'); }
    if (SYNC.token && Date.now() - (SYNC.last || 0) > 20000) syncNow();
    if (Date.now() - (RATES_AUTO.t || 0) > 600e3) fetchRates();
  }
});
window.addEventListener('online', () => SYNC.token && syncNow());
// поки застосунок відкритий — підтягувати зміни з іншого телефона кожні 45 с
setInterval(() => { if (!document.hidden && SYNC.token && !syncState.busy) syncNow(); }, 45000);
const APP_VERSION = '2.3';
async function updateApp() {
  toast('Оновлюю застосунок…');
  try { const regs = await navigator.serviceWorker?.getRegistrations?.() || []; for (const r of regs) await r.unregister(); } catch (e) {}
  try { const keys = await caches.keys(); for (const k of keys) await caches.delete(k); } catch (e) {}
  if (SYNC.token) { try { await syncNow(); } catch (e) {} }
  location.reload();
}

/* ============ actions ============ */
const ACT = {
  tab: id => { UI.tab = id; if (id === 'more') UI.sub = 'menu'; render(); window.scrollTo(0, 0); },
  sub: id => { UI.tab = 'more'; UI.sub = id; render(); window.scrollTo(0, 0); },
  mPrev: () => { UI.month = addMonth(UI.month, -1); render(); },

  addTx: () => txForm(),

  delTx: id => { if (!confirm('Видалити операцію?')) return; for (const r of list('rec')) for (const [m, tid] of Object.entries(r.paid || {})) if (tid === id) { const p = { ...r.paid }; delete p[m]; put('rec', { ...r, paid: p }); }
    remove('tx', id); closeSheet(); render(); toast('Видалено'); },
  closeSheet,
  editLimit: id => limitForm(id),

  delGoal: id => { if (confirm('Видалити ціль?')) { remove('goal', id); closeSheet(); render(); } },
  editDebt: id => debtForm(id), debtPay: (id, el) => debtPay(id, el?.dataset?.amt),

  editRec: id => recForm(id), payRec: id => payRec(id),
  delRec: id => { if (confirm('Видалити регулярний платіж?')) { remove('rec', id); closeSheet(); render(); } },
  editAcc: id => accForm(id),
  newAcc: kind => accForm(null, kind),
  homeSettings,
  updateApp: () => updateApp(),
  planSave: () => { const m = parseAmt($('#plM').value), b = parseAmt($('#plB').value); setSetting('plan', { monthly: m > 0 ? m : 16000, bonusUsd: b >= 0 ? b : 0 }); render(); toast('План оновлено ✓'); },
  bonusForm,
  payCreditAmt: (id, el) => { const a = get('acc', id); const from = (lastTx.acc && lastTx.acc !== id && akind(get('acc', lastTx.acc)) === 'reg') ? lastTx.acc : accs().find(x => akind(x) === 'reg')?.id;
    txForm(null, { type: 'tr', acc: from, acc2: id, amount: Number(el.dataset.amt) || '', note: 'Погашення ' + a.name }); },
  hero: i => { const el = $('#heros'); if (!el) return; el.scrollTo({ left: Number(i) * el.clientWidth, behavior: 'smooth' }); localStorage.setItem('fb_hero', i);
    document.querySelectorAll('.hdots button').forEach((d, k) => d.classList.toggle('on', k === Number(i))); },
  payCredit: id => { const a = get('acc', id); const ci = creditInfo(a); const from = (lastTx.acc && lastTx.acc !== id && akind(get('acc', lastTx.acc)) === 'reg') ? lastTx.acc : accs().find(x => akind(x) === 'reg')?.id;
    txForm(null, { type: 'tr', acc: from, acc2: id, amount: ci.minLeft || ci.nextMin || '', note: 'Погашення ' + a.name }); },
  minPaid: id => { const a = get('acc', id); if (!confirm(`Позначити, що мінімальний платіж по «${a.name}» за цей місяць уже внесено? (суму боргу вкажіть у налаштуваннях картки)`)) return;
    put('acc', { ...a, minPaid: ymOf(new Date()) }); render(); toast('Позначено ✓'); },
  saveRemind: () => { const v = parseInt($('#remDays').value); setSetting('remind', { days: isNaN(v) ? 3 : Math.max(0, Math.min(14, v)) }); toast('Збережено ✓'); },
  shift: date => shiftForm(date),
  earnWho: id => { UI.earnWho = id; render(); },
  setMe: id => { localStorage.setItem('fb_me', id); lastTx.who = id; localStorage.setItem('fb_last', JSON.stringify(lastTx)); openSettings(); render(); toast('Збережено ✓'); },
  homeMove: (k, el) => { const c = homeCfg(); const i = c.order.indexOf(k), j = i + Number(el.dataset.d); if (j < 0 || j >= c.order.length) return; [c.order[i], c.order[j]] = [c.order[j], c.order[i]]; saveHomeCfg(c); render(); homeSettings(); },
  homeReset: () => { localStorage.removeItem('fb_home'); render(); homeSettings(); },
  ratesRefresh: () => { toast('Оновлюю курс…'); fetchRates(true); },
  ratesAuto: () => { setSetting('rates', { manual: false }); closeSheet(); fetchRates(true); render(); },
  delAcc: id => { const n = txs().filter(t => t.acc === id || t.acc2 === id).length; if (confirm(n ? `На рахунку є ${n} операцій — вони залишаться, але без рахунку. Видалити?` : 'Видалити рахунок?')) { remove('acc', id); closeSheet(); render(); } },
  editCat: id => catForm(id),
  delCat: id => { const n = txs().filter(t => t.cat === id).length; if (confirm(n ? `У категорії ${n} операцій — вони стануть «Без категорії». Видалити?` : 'Видалити категорію?')) { remove('cat', id); closeSheet(); render(); } },
  settings: openSettings,
  syncNow: () => syncNow(true),
  syncOff: () => { if (!confirm('Вимкнути синхронізацію на цьому пристрої? Дані залишаться в телефоні та в репозиторії.')) return; SYNC = {}; localStorage.removeItem(LS.sync); setSyncUI('off', ''); closeSheet(); render(); },
  editMem: id => memForm(id),
  delMem: id => { if (members().length < 2) return toast('Потрібна хоча б одна людина'); if (confirm('Видалити?')) { remove('member', id); openSettings(); } },
  pinSet: () => { closeSheet(); pinMode = 'set'; rebuildPad(); showLock('set'); },
  pinOff: () => { localStorage.removeItem(LS.pin); openSettings(); toast('PIN прибрано'); },
  exportJson: () => download(`budget-${todayStr()}.json`, canonical(DB), 'application/json'),
  exportCsv,
  importJson: () => $('#impFile').click(),
  wipe: () => { if (!confirm('Видалити ВСІ дані з цього пристрою? ' + (SYNC.token ? 'Копія в GitHub залишиться, при наступній синхронізації дані повернуться.' : 'Спочатку завантажте резервну копію!'))) return;
    localStorage.removeItem(LS.data); localStorage.removeItem(LS.dirty); DB = seed(); saveLocal(); closeSheet(); render(); if (SYNC.token) syncNow(); },
};
document.addEventListener('click', e => {

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

{ const sd = seed(); let added = false; for (const c of COLS) for (const id in sd.col[c]) if (!DB.col[c][id]) { DB.col[c][id] = sd.col[c][id]; added = true; } if (added) saveLocal(); }
if (UI.tab === 'more' && !UI.sub) UI.sub = 'menu';
saveLocal(); render();
setSyncUI(SYNC.token ? (localStorage.getItem(LS.dirty) ? 'pending' : 'ok') : 'off');
if (localStorage.getItem(LS.pin)) { rebuildPad(); showLock('check'); }
if (SYNC.token) syncNow();
fetchRates();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
